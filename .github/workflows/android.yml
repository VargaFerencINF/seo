name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release APK készítése is'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Adatforrások (próbahívás + Natura kivonat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Próbahívások minden adatforrásra
        run: npm run check:sources
      - name: Natura 2000 kivonat (EEA)
        continue-on-error: true
        run: npm run data:natura
      - name: Natura kivonat feltöltése
        if: hashFiles('public/data/natura2000_hu.geojson') != ''
        uses: actions/upload-artifact@v4
        with:
          name: natura2000-hu
          path: public/data/natura2000_hu.geojson

  build:
    needs: sources
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Függőségek
        run: npm ci

      - name: Natura kivonat letöltése (ha elkészült)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: natura2000-hu
          path: public/data

      - name: Lint
        run: npm run lint

      - name: Tesztek
        run: npm test

      - name: Web build
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: teleklato-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release APK
    needs: sources
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Natura kivonat letöltése (ha elkészült)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: natura2000-hu
          path: public/data
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Aláíró kulcs (GitHub Secrets-ből)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
      - name: Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Aláírás ellenőrzése
        if: env.HAS_KEYSTORE == 'true'
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Release APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: teleklato-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
