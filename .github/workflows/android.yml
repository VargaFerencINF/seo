name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: Adatforrások (próbahívás + Natura kivonat)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Próbahívások minden adatforrásra
        run: npm run check:sources
      - name: Natura 2000 kivonat (EEA)
        continue-on-error: true
        run: npm run data:natura
      - name: Natura kivonat feltöltése
        if: hashFiles('public/data/natura2000_hu.geojson') != ''
        uses: actions/upload-artifact@v4
        with:
          name: natura2000-hu
          path: public/data/natura2000_hu.geojson

  build:
    needs: sources
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Függőségek
        run: npm ci

      - name: Natura kivonat letöltése (ha elkészült)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: natura2000-hu
          path: public/data

      - name: Lint
        run: npm run lint

      - name: Tesztek
        run: npm test

      - name: Web build
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: teleklato-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
